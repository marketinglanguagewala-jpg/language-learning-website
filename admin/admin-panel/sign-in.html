    <script>
        async function loginUser() {
        
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
        
            let fd = new FormData();
            fd.append("email", email);
            fd.append("password", password);
        
            let res = await fetch("https://admin.languagewala.in/backend-php/admin_login.php", {
                method: "POST",
                body: fd,
                credentials: "include" // 🔴 VERY IMPORTANT (session ke liye)
            });
        
            let data = await res.text();
            data = data.trim();
        
            if (data === "admin") {
                window.location.href = "index.html";   // admin dashboard
            } 
            else if (data === "user") {
                window.location.href = "index.html";   // same dashboard (filtered view)
            } 
            else {
                alert(data);
            }
        }
    </script>
